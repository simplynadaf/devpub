[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devpub"
version = "0.2.1"
description = "Write in your editor. Publish to Dev.to. Track what works."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Sarvar Nadaf", email = "simplynadaf@gmail.com" },
]
keywords = ["devto", "blog", "cli", "publishing", "analytics", "dev.to", "forem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
devpub = "devpub.cli.main:cli"

[project.urls]
Homepage = "https://github.com/simplynadaf/devpub"
Documentation = "https://github.com/simplynadaf/devpub#readme"
Repository = "https://github.com/simplynadaf/devpub"
Issues = "https://github.com/simplynadaf/devpub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/devpub"]

[tool.hatch.build.targets.sdist]
exclude = [
    "demo/",
    "tests/",
    "*.mp4",
    "*.webm",
    "*.png",
    "*.svg",
    "node_modules/",
    ".github/",
    "BUILD-PLAN.md",
    "RESEARCH.md",
    "COMPETITIVE-ANALYSIS.md",
    "COMPETITOR-PERFORMANCE.md",
    "PROS-CONS-ANALYSIS.md",
    "NEW-API-DISCOVERIES.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/devpub/core/article.py" = ["W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
