<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#80ffdb"/>
      <stop offset="100%" style="stop-color:#72efdd"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="320" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="320" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="320" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Terminal icon -->
  <g transform="translate(80, 110)">
    <rect width="100" height="70" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="18" rx="8" fill="rgba(0,0,0,0.2)"/>
    <circle cx="12" cy="9" r="3" fill="#ff5f57"/>
    <circle cx="24" cy="9" r="3" fill="#febc2e"/>
    <circle cx="36" cy="9" r="3" fill="#28c840"/>
    <text x="12" y="38" font-family="monospace" font-size="10" fill="#80ffdb">$ devpub push</text>
    <text x="12" y="52" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.7)">Created: My Article</text>
    <text x="12" y="63" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">URL: dev.to/...</text>
  </g>
  
  <!-- Title -->
  <text x="240" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">devpub</text>
  
  <!-- Tagline -->
  <text x="240" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="300" fill="rgba(255,255,255,0.9)">Write in your editor. Publish to Dev.to. Track what works.</text>
  
  <!-- Feature pills -->
  <g transform="translate(240, 200)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="60" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">Push &amp; Pull</text>
    
    <rect x="135" y="0" width="100" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="185" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">Analytics</text>
    
    <rect x="250" y="0" width="110" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="305" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">AI Search</text>
    
    <rect x="375" y="0" width="110" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="430" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">Validation</text>
    
    <rect x="500" y="0" width="100" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="550" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">Trends</text>
  </g>
  
  <!-- Install command -->
  <g transform="translate(240, 258)">
    <rect x="0" y="0" width="280" height="36" rx="8" fill="rgba(0,0,0,0.25)"/>
    <text x="16" y="23" font-family="'Courier New', monospace" font-size="14" fill="rgba(255,255,255,0.6)">$</text>
    <text x="30" y="23" font-family="'Courier New', monospace" font-size="14" fill="url(#accent)">pip install devpub</text>
  </g>
  
  <!-- Version badge -->
  <g transform="translate(1120, 20)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="65" y="19" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="white" text-anchor="middle">v0.1.0 beta</text>
  </g>
  
  <!-- Decorative dots -->
  <g opacity="0.15">
    <circle cx="1100" cy="200" r="80" fill="white"/>
    <circle cx="1200" cy="280" r="40" fill="white"/>
    <circle cx="1050" cy="280" r="30" fill="white"/>
  </g>
</svg>
